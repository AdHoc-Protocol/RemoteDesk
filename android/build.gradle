// The app: no AndroidX, no layouts of XML - the activities of Android and the library of the host, nothing more in the APK. The
// library comes built into src/main/jniLibs ( the workflow: cargo-ndk, and libadhoc-crypto of its release beside it ).

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Kotlin is in the plugin of Android itself ( AGP 9 )
        classpath 'com.android.tools.build:gradle:+'
    }
}

apply plugin: 'com.android.application'

repositories {
    google()
    mavenCentral()
}

android {
    namespace = 'org.unirail.RemoteDesk'
    compileSdk = 36

    defaultConfig {
        applicationId = 'org.unirail.RemoteDesk'
        // Android 10: the sound of the apps ( AudioPlaybackCapture ), the frames to the encoder capped, the parameter sets before each key frame
        minSdk = 29
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // TODO: a key of its own, kept in the secrets of the repository: an APK signed by another key does not install over this one
            signingConfig = signingConfigs.debug
        }
    }

    packaging {
        // the libraries unpacked on the phone: the host opens libadhoc-crypto by its path
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
