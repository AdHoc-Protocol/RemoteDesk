<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="860" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect x="0" y="0" width="860" height="380" rx="12" fill="#0d1117"/>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>

  <text x="430" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">Several viewers: all see, one controls</text>

  <!-- the remote computer -->
  <rect x="20" y="120" width="200" height="120" rx="12" fill="#0c2340" stroke="#58a6ff" stroke-width="2"/>
  <text x="120" y="152" text-anchor="middle" font-weight="600" fill="#79c0ff">Remote computer</text>
  <text x="120" y="176" text-anchor="middle" fill="#e6edf3">one capture, one encoder</text>
  <text x="120" y="196" text-anchor="middle" fill="#e6edf3">per display</text>
  <text x="120" y="222" text-anchor="middle" font-size="12" fill="#8b949e">up to 8 viewers</text>

  <!-- the viewers -->
  <rect x="560" y="64" width="280" height="70" rx="10" fill="#0f2a17" stroke="#3fb950" stroke-width="3"/>
  <text x="580" y="92" font-weight="600" fill="#56d364">Anna · controls</text>
  <text x="580" y="116" font-size="12" fill="#c9d1d9">sees; her keys, mouse, Fit, microphone go in</text>

  <rect x="560" y="150" width="280" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="580" y="176" font-weight="600" fill="#56d364">Boris · watches</text>
  <text x="580" y="198" font-size="12" fill="#8b949e">sees, hears; Take control makes him the one</text>

  <rect x="560" y="226" width="280" height="60" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="580" y="252" font-weight="600" fill="#56d364">Vera · watches</text>
  <text x="580" y="274" font-size="12" fill="#8b949e">another display, if she picked one</text>

  <!-- the picture to all -->
  <line x1="222" y1="160" x2="556" y2="96" stroke="#58a6ff" stroke-width="2" marker-end="url(#blue)"/>
  <line x1="222" y1="180" x2="556" y2="180" stroke="#58a6ff" stroke-width="2" marker-end="url(#blue)"/>
  <line x1="222" y1="200" x2="556" y2="256" stroke="#58a6ff" stroke-width="2" marker-end="url(#blue)"/>
  <text x="400" y="210" text-anchor="middle" font-size="12" fill="#79c0ff">the same frames to each one</text>

  <!-- the input of one -->
  <path d="M558,78 C420,36 220,40 130,116" fill="none" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#green)"/>
  <text x="340" y="84" text-anchor="middle" font-size="12" fill="#56d364">the input of the one who controls</text>

  <!-- rules -->
  <text x="430" y="320" text-anchor="middle" fill="#e6edf3">The first one in controls · <tspan font-weight="600">Take control</tspan> moves it at once · the one who controls leaves: the one in longest takes over</text>
  <text x="430" y="346" text-anchor="middle" font-size="12" fill="#8b949e">A viewer whose network falls behind holds the others 3 seconds at most: then it is passed over, and catches up with a fresh picture</text>
</svg>
