<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 778" width="860" height="778" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <rect x="0" y="0" width="860" height="778" rx="12" fill="#0d1117"/>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#58a6ff"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3fb950"/></marker>
  </defs>

  <text x="430" y="30" text-anchor="middle" font-size="17" font-weight="600" fill="#e6edf3">Four ways to reach the remote computer</text>
  <text x="430" y="50" text-anchor="middle" font-size="12" fill="#8b949e">Your device always dials; the line you paste into Remote machine, the token in it after #, is at the bottom of each way</text>

  <!-- ① the same network -->
  <rect x="10" y="66" width="840" height="166" rx="10" fill="#10151c" stroke="#30363d"/>
  <text x="26" y="90" font-weight="600" fill="#e6edf3">① In the same network: one home, one office</text>
  <rect x="30" y="104" width="170" height="64" rx="10" fill="#0c2340" stroke="#58a6ff" stroke-width="2"/>
  <text x="115" y="130" text-anchor="middle" font-weight="600" fill="#79c0ff">Remote computer</text>
  <text x="115" y="152" text-anchor="middle" font-size="12" fill="#8b949e">192.168.1.20</text>
  <rect x="345" y="104" width="170" height="64" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="430" y="130" text-anchor="middle" font-weight="600" fill="#c9d1d9">Wi-Fi router</text>
  <text x="430" y="152" text-anchor="middle" font-size="12" fill="#8b949e">passes it inside the home</text>
  <rect x="660" y="104" width="170" height="64" rx="10" fill="#0f2a17" stroke="#3fb950" stroke-width="2"/>
  <text x="745" y="130" text-anchor="middle" font-weight="600" fill="#56d364">Your device</text>
  <text x="745" y="152" text-anchor="middle" font-size="12" fill="#8b949e">192.168.1.35</text>
  <line x1="658" y1="136" x2="517" y2="136" stroke="#3fb950" stroke-width="2" marker-end="url(#green)"/>
  <line x1="343" y1="136" x2="202" y2="136" stroke="#3fb950" stroke-width="2" marker-end="url(#green)"/>
  <text x="430" y="200" text-anchor="middle" font-family="Consolas, monospace" fill="#e6edf3">ws://192.168.1.20:8765#K7QM2XHP9RTA4WZD8CNE</text>
  <text x="430" y="220" text-anchor="middle" font-size="12" fill="#8b949e">the line rdp-host prints for this network: its address there, and after # the token · nothing to set up</text>

  <!-- ② reachable from the internet -->
  <rect x="10" y="244" width="840" height="166" rx="10" fill="#10151c" stroke="#30363d"/>
  <text x="26" y="268" font-weight="600" fill="#e6edf3">② The remote computer is reachable from the internet</text>
  <rect x="30" y="282" width="170" height="64" rx="10" fill="#0c2340" stroke="#58a6ff" stroke-width="2"/>
  <text x="115" y="308" text-anchor="middle" font-weight="600" fill="#79c0ff">Remote computer</text>
  <text x="115" y="330" text-anchor="middle" font-size="12" fill="#8b949e">192.168.1.20</text>
  <rect x="240" y="282" width="170" height="64" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="325" y="308" text-anchor="middle" font-weight="600" fill="#c9d1d9">Its router</text>
  <text x="325" y="330" text-anchor="middle" font-size="12" fill="#8b949e">port 8765 forwarded to it</text>
  <rect x="450" y="282" width="170" height="64" rx="32" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="535" y="320" text-anchor="middle" fill="#c9d1d9">the internet</text>
  <rect x="660" y="282" width="170" height="64" rx="10" fill="#0f2a17" stroke="#3fb950" stroke-width="2"/>
  <text x="745" y="308" text-anchor="middle" font-weight="600" fill="#56d364">Your device</text>
  <text x="745" y="330" text-anchor="middle" font-size="12" fill="#8b949e">anywhere</text>
  <line x1="658" y1="314" x2="622" y2="314" stroke="#3fb950" stroke-width="2" marker-end="url(#green)"/>
  <line x1="448" y1="314" x2="412" y2="314" stroke="#3fb950" stroke-width="2" marker-end="url(#green)"/>
  <line x1="238" y1="314" x2="202" y2="314" stroke="#3fb950" stroke-width="2" marker-end="url(#green)"/>
  <text x="430" y="378" text-anchor="middle" font-family="Consolas, monospace" fill="#e6edf3">ws://203.0.113.7:8765#K7QM2XHP9RTA4WZD8CNE</text>
  <text x="430" y="398" text-anchor="middle" font-size="12" fill="#8b949e">the line rdp-host prints for the internet, with the public address of its router, and after # the token</text>

  <!-- ③ both behind NAT -->
  <rect x="10" y="422" width="840" height="166" rx="10" fill="#10151c" stroke="#30363d"/>
  <text x="26" y="446" font-weight="600" fill="#e6edf3">③ Both behind NAT: through a meeting point with SYN Mirror</text>
  <rect x="20" y="460" width="150" height="64" rx="10" fill="#0c2340" stroke="#58a6ff" stroke-width="2"/>
  <text x="95" y="486" text-anchor="middle" font-weight="600" fill="#79c0ff">Remote computer</text>
  <text x="95" y="508" text-anchor="middle" font-size="12" fill="#8b949e">waits, dialing out</text>
  <rect x="195" y="465" width="110" height="54" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="250" y="497" text-anchor="middle" font-weight="600" fill="#c9d1d9">NAT</text>
  <rect x="330" y="456" width="200" height="72" rx="12" fill="#2b1d06" stroke="#f0a020" stroke-width="2.5"/>
  <text x="430" y="484" text-anchor="middle" font-weight="600" fill="#ffb340">Meeting point</text>
  <text x="430" y="506" text-anchor="middle" font-size="12" fill="#8b949e">joins the two in its kernel</text>
  <rect x="555" y="465" width="110" height="54" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="610" y="497" text-anchor="middle" font-weight="600" fill="#c9d1d9">NAT</text>
  <rect x="690" y="460" width="150" height="64" rx="10" fill="#0f2a17" stroke="#3fb950" stroke-width="2"/>
  <text x="765" y="486" text-anchor="middle" font-weight="600" fill="#56d364">Your device</text>
  <text x="765" y="508" text-anchor="middle" font-size="12" fill="#8b949e">dials it</text>
  <line x1="172" y1="492" x2="193" y2="492" stroke="#58a6ff" stroke-width="2" marker-end="url(#blue)"/>
  <line x1="307" y1="492" x2="328" y2="492" stroke="#58a6ff" stroke-width="2" marker-end="url(#blue)"/>
  <line x1="688" y1="492" x2="667" y2="492" stroke="#3fb950" stroke-width="2" marker-end="url(#green)"/>
  <line x1="553" y1="492" x2="532" y2="492" stroke="#3fb950" stroke-width="2" marker-end="url(#green)"/>
  <text x="430" y="556" text-anchor="middle" font-family="Consolas, monospace" fill="#e6edf3">ws://router.example.org:41933#K7QM2XHP9RTA4WZD8CNE</text>
  <text x="430" y="576" text-anchor="middle" font-size="12" fill="#8b949e">the line rdp-host prints: the meeting point, the port it gave, and after # the token · nothing to forward at either home</text>
  <!-- ④ direct -->
  <rect x="10" y="600" width="840" height="166" rx="10" fill="#10151c" stroke="#30363d"/>
  <text x="26" y="624" font-weight="600" fill="#e6edf3">④ Both behind NAT, no meeting point: direct</text>
  <rect x="20" y="660" width="150" height="64" rx="10" fill="#0c2340" stroke="#58a6ff" stroke-width="2"/>
  <text x="95" y="686" text-anchor="middle" font-weight="600" fill="#79c0ff">Remote computer</text>
  <text x="95" y="708" text-anchor="middle" font-size="12" fill="#8b949e">rdp-host --direct</text>
  <rect x="195" y="665" width="110" height="54" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="250" y="697" text-anchor="middle" font-weight="600" fill="#c9d1d9">NAT</text>
  <rect x="555" y="665" width="110" height="54" rx="8" fill="#161b22" stroke="#8b949e" stroke-width="2"/>
  <text x="610" y="697" text-anchor="middle" font-weight="600" fill="#c9d1d9">NAT</text>
  <rect x="690" y="660" width="150" height="64" rx="10" fill="#0f2a17" stroke="#3fb950" stroke-width="2"/>
  <text x="765" y="686" text-anchor="middle" font-weight="600" fill="#56d364">Your device</text>
  <text x="765" y="708" text-anchor="middle" font-size="12" fill="#8b949e">Direct connection</text>
  <line x1="172" y1="692" x2="193" y2="692" stroke="#58a6ff" stroke-width="2"/>
  <line x1="688" y1="692" x2="667" y2="692" stroke="#3fb950" stroke-width="2"/>
  <line x1="307" y1="692" x2="553" y2="692" stroke="#3fb950" stroke-width="3" marker-start="url(#blue)" marker-end="url(#green)"/>
  <text x="430" y="684" text-anchor="middle" font-size="12" fill="#56d364">straight, no one between</text>
  <path d="M95,660 C120,650 740,650 765,660" fill="none" stroke="#c9d1d9" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="430" y="644" text-anchor="middle" font-size="12" fill="#c9d1d9">a line or two by hand: chat, mail</text>
  <text x="430" y="744" text-anchor="middle" font-family="Consolas, monospace" fill="#e6edf3">one ws://…#… line, or rd1o.… there and rd1a.… back into Remote machine</text>
  <text x="430" y="762" text-anchor="middle" font-size="12" fill="#8b949e">one line when its router opens a port ( UPnP, NAT-PMP, PCP ) · else two · both NATs symmetric: ③</text>
</svg>
